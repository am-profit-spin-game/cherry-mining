
services:
  - type: web
    name: cherry-mining
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: MINING_REWARD
        value: "500"
      - key: REFERRAL_REWARD
        value: "100"
      - key: TASK_REWARD
        value: "50"
      - key: MONETAG_SECRET
        sync: false
